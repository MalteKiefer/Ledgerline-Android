name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least-privilege: read-only unless a step needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Test · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle wrapper is SHA-256 pinned (gradle-wrapper.properties) and validated here.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Android Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain

  dependency-scan:
    name: Vulnerable-dependency scan (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.2
        with:
          scan-args: |-
            --lockfile=gradle/libs.versions.toml
            ./
