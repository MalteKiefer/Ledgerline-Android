name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least-privilege: read-only unless a step needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Test · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle wrapper is SHA-256 pinned (gradle-wrapper.properties) and validated here.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Android Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain

  dependency-scan:
    name: Vulnerable-dependency scan (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSV Scanner
        # osv-scanner has no Gradle version-catalog (libs.versions.toml) extractor, and this repo
        # has no resolved gradle.lockfile — so a recursive scan finds no supported manifest and
        # exits 128. We run the binary directly and fail ONLY on exit 1 (real vulnerabilities);
        # 0 (clean) and 128 (nothing scannable yet) pass. Adding Gradle dependency locking
        # (gradle.lockfile) would make this actually cover the app's dependencies.
        run: |
          ver=v2.3.8
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/${ver}/osv-scanner_linux_amd64" -o osv-scanner
          chmod +x osv-scanner
          set +e
          ./osv-scanner scan source --recursive ./
          code=$?
          echo "osv-scanner exit code: $code"
          [ "$code" = "1" ] && exit 1
          exit 0
